# Nova persona definitions for rego test generation.
# Nova uses project_id for ownership. Uses project_member_or_admin
# and project_reader_or_admin patterns.

personas:
  system_admin:
    description: "System-scoped admin, bypasses domain isolation"
    credentials:
      project_id: "sys-project-1"
      user_id: "sys-admin-user"
      user_domain_id: "default"
      project_domain_id: "default"
      domain_id: "default"
      system_scope: "all"
      is_admin: true
      is_admin_project: true
      roles: ["admin", "member", "reader"]
      service_roles: []
    target_defaults:
      project_id: "project-a"
      domain_id: "domain-a"

  project_admin:
    description: "Project-scoped admin in domain-a"
    credentials:
      project_id: "project-a"
      user_id: "admin-user-1"
      user_domain_id: "domain-a"
      project_domain_id: "domain-a"
      domain_id: null
      system_scope: null
      is_admin: true
      is_admin_project: true
      roles: ["admin", "member", "reader"]
      service_roles: []
    target_defaults:
      project_id: "project-a"
      domain_id: "domain-a"

  project_member:
    description: "Project member in domain-a"
    credentials:
      project_id: "project-a"
      user_id: "member-user-1"
      user_domain_id: "domain-a"
      project_domain_id: "domain-a"
      domain_id: null
      system_scope: null
      is_admin: false
      is_admin_project: false
      roles: ["member"]
      service_roles: []
    target_defaults:
      project_id: "project-a"
      domain_id: "domain-a"

  project_reader:
    description: "Project reader in domain-a"
    credentials:
      project_id: "project-a"
      user_id: "reader-user-1"
      user_domain_id: "domain-a"
      project_domain_id: "domain-a"
      domain_id: null
      system_scope: null
      is_admin: false
      is_admin_project: false
      roles: ["reader"]
      service_roles: []
    target_defaults:
      project_id: "project-a"
      domain_id: "domain-a"

  # Denial personas
  cross_domain_admin:
    description: "Admin from domain-b accessing domain-a resources"
    deny: true
    credentials:
      project_id: "project-b"
      user_id: "admin-user-b"
      user_domain_id: "domain-b"
      project_domain_id: "domain-b"
      domain_id: null
      system_scope: null
      is_admin: true
      is_admin_project: true
      roles: ["admin", "member", "reader"]
      service_roles: []
    target_defaults:
      project_id: "project-a"
      domain_id: "domain-a"

  cross_project_member:
    description: "Member from project-b accessing project-a resources (same domain)"
    deny: true
    credentials:
      project_id: "project-b"
      user_id: "member-user-b"
      user_domain_id: "domain-a"
      project_domain_id: "domain-a"
      domain_id: null
      system_scope: null
      is_admin: false
      is_admin_project: false
      roles: ["member"]
      service_roles: []
    target_defaults:
      project_id: "project-a"
      domain_id: "domain-a"

  wrong_role:
    description: "User with no relevant roles and no project match"
    deny: true
    credentials:
      project_id: "project-c"
      user_id: "norole-user"
      user_domain_id: "domain-a"
      project_domain_id: "domain-a"
      domain_id: null
      system_scope: null
      is_admin: false
      is_admin_project: false
      roles: []
      service_roles: []
    target_defaults:
      project_id: "project-a"
      domain_id: "domain-a"
