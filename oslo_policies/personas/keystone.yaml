# Keystone persona definitions for rego test generation.
# Keystone uses domain-scoped tokens, domain manager role,
# and nested credential fields (token.domain.id, token.project.domain.id).
# Keystone target dicts use 'target.' prefixed flat keys (e.g. target.domain_id).

target_resources:
  # Trust operations: trustor_user_id must match credentials.user_id
  trust:
    patterns: ["trust"]
    fields:
      trust:
        trustor_user_id: "MATCH_USER_ID"
      "trust.trustor_user_id": "MATCH_USER_ID"

  # Credential operations
  credential:
    patterns: ["credential"]
    fields:
      user_id: "MATCH_USER_ID"
      credential:
        user_id: "MATCH_USER_ID"
      "credential.user_id": "MATCH_USER_ID"

  # Application credential operations
  application_credential:
    patterns: ["application_credential"]
    fields:
      user_id: "MATCH_USER_ID"
      credential:
        user_id: "MATCH_USER_ID"

  # Limit operations
  limit:
    patterns: ["limit"]
    fields:
      "target.project_id": "project-a"
      "target.limit.project_id": "project-a"
      "target.limit.project.domain_id": "domain-a"
      "target.limit.domain.id": "domain-a"
      limit:
        project_id: "project-a"
        project:
          domain_id: "domain-a"
        domain:
          id: "domain-a"

  # Token operations
  token:
    patterns: ["token"]
    fields:
      "target.token.user_id": "MATCH_USER_ID"
      "target.token.user.domain.id": "domain-a"

personas:
  system_admin:
    description: "System-scoped admin, full cloud access"
    credentials:
      user_id: "sys-admin-user"
      user_domain_id: "default"
      project_domain_id: "default"
      domain_id: "default"
      system_scope: "all"
      is_admin: 1
      is_admin_project: true
      roles: ["admin", "member", "reader"]
      service_roles: []
      token:
        domain:
          id: "default"
        project:
          domain:
            id: "default"
    target_defaults:
      domain_id: "domain-a"
      "target.domain_id": "domain-a"
      "target.user.domain_id": "domain-a"
      "target.project.domain_id": "domain-a"
      "target.project.id": "project-a"
      "target.group.domain_id": "domain-a"
      user:
        domain_id: "domain-a"
      project:
        id: "project-a"
        domain_id: "domain-a"
      group:
        domain_id: "domain-a"
      domain:
        id: "domain-a"

  domain_manager:
    description: "Domain manager with domain-scoped token for domain-a"
    credentials:
      user_id: "domain-mgr-1"
      user_domain_id: "domain-a"
      project_domain_id: "domain-a"
      domain_id: "domain-a"
      system_scope: null
      is_admin: 0
      is_admin_project: false
      roles: ["manager", "member", "reader"]
      service_roles: []
      token:
        domain:
          id: "domain-a"
        project:
          domain:
            id: "domain-a"
    target_defaults:
      domain_id: "domain-a"
      "target.domain_id": "domain-a"
      "target.user.domain_id": "domain-a"
      "target.project.domain_id": "domain-a"
      "target.project.id": "project-a"
      "target.group.domain_id": "domain-a"
      "target.role.name": "member"
      user:
        domain_id: "domain-a"
      project:
        id: "project-a"
        domain_id: "domain-a"
      group:
        domain_id: "domain-a"
      domain:
        id: "domain-a"
      role:
        name: "member"

  project_admin:
    description: "Project-scoped admin in domain-a"
    credentials:
      project_id: "project-a"
      user_id: "admin-user-1"
      user_domain_id: "domain-a"
      project_domain_id: "domain-a"
      domain_id: null
      system_scope: null
      is_admin: 1
      is_admin_project: true
      roles: ["admin", "member", "reader"]
      service_roles: []
      token:
        project:
          domain:
            id: "domain-a"
    target_defaults:
      domain_id: "domain-a"
      "target.domain_id": "domain-a"
      "target.user.domain_id": "domain-a"
      "target.project.domain_id": "domain-a"
      "target.project.id": "project-a"
      "target.group.domain_id": "domain-a"
      user:
        domain_id: "domain-a"
      project:
        id: "project-a"
        domain_id: "domain-a"
      group:
        domain_id: "domain-a"
      domain:
        id: "domain-a"

  project_member:
    description: "Project member in domain-a"
    credentials:
      project_id: "project-a"
      user_id: "member-user-1"
      user_domain_id: "domain-a"
      project_domain_id: "domain-a"
      domain_id: null
      system_scope: null
      is_admin: 0
      is_admin_project: false
      roles: ["member"]
      service_roles: []
      token:
        project:
          domain:
            id: "domain-a"
    target_defaults:
      domain_id: "domain-a"
      "target.domain_id": "domain-a"
      "target.user.domain_id": "domain-a"
      "target.project.domain_id": "domain-a"
      "target.project.id": "project-a"
      "target.group.domain_id": "domain-a"
      user:
        domain_id: "domain-a"
      project:
        id: "project-a"
        domain_id: "domain-a"
      credential:
        user_id: "member-user-1"

  project_reader:
    description: "Project reader in domain-a"
    credentials:
      project_id: "project-a"
      user_id: "reader-user-1"
      user_domain_id: "domain-a"
      project_domain_id: "domain-a"
      domain_id: null
      system_scope: null
      is_admin: 0
      is_admin_project: false
      roles: ["reader"]
      service_roles: []
      token:
        project:
          domain:
            id: "domain-a"
    target_defaults:
      domain_id: "domain-a"
      "target.domain_id": "domain-a"
      "target.user.domain_id": "domain-a"
      "target.project.domain_id": "domain-a"
      "target.project.id": "project-a"
      "target.group.domain_id": "domain-a"
      user:
        domain_id: "domain-a"
      project:
        id: "project-a"
        domain_id: "domain-a"

  service_user:
    description: "Service account"
    credentials:
      project_id: "service-project"
      user_id: "service-user"
      user_domain_id: "default"
      project_domain_id: "default"
      domain_id: null
      system_scope: null
      is_admin: 0
      is_admin_project: false
      roles: ["service"]
      service_roles: []
      token:
        project:
          domain:
            id: "default"
    target_defaults:
      domain_id: "domain-a"
      "target.domain_id": "domain-a"

  # Keystone handles domain isolation natively in its API layer.
  # Cross-domain deny tests are not applicable at the rego level.

  wrong_role:
    description: "User with no relevant roles and no project match"
    deny: true
    credentials:
      project_id: "project-c"
      user_id: "norole-user"
      user_domain_id: "domain-a"
      project_domain_id: "domain-a"
      domain_id: null
      system_scope: null
      is_admin: 0
      is_admin_project: false
      roles: []
      service_roles: []
      token:
        project:
          domain:
            id: "domain-a"
    target_defaults:
      domain_id: "domain-a"
